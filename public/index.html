<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aircraft Log</title>

  <style>
    body {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
      font-family: Arial, sans-serif;
      color: #263244;
      background: #f5f6f8;
    }

    section {
      background: white;
      padding: 24px;
      margin: 20px 0;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
    }

    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      font: inherit;
    }

    input, textarea {
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 18px;
      background: #334155;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .record {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    #message {
      font-size: 14px;
    }

    #connection-status {
      font-size: 14px;
      color: #64748b;
    }
  </style>
</head>

<body>
  <h1>Aircraft Log</h1>
  <p>A simple journal for recording the aircraft you spot.</p>
  <p id="connection-status">Connecting to server...</p>

  <section>
    <h2>Add a new sighting</h2>

    <form id="sighting-form">
      <label for="aircraft">Aircraft model *</label>
      <input
        id="aircraft"
        name="aircraft"
        placeholder="e.g. Boeing 777-300ER"
        required
      >

      <label for="airport">Airport *</label>
      <input
        id="airport"
        name="airport"
        placeholder="e.g. Shenzhen Bao'an (SZX)"
        required
      >

      <label for="date">Date *</label>
      <input id="date" name="date" type="date" required>

      <label for="notes">Notes</label>
      <textarea
        id="notes"
        name="notes"
        placeholder="Write a short note"
      ></textarea>

      <button id="submit-button" type="submit">Save Sighting</button>
      <p id="message" role="status"></p>
    </form>
  </section>

  <section>
    <h2>Recent sightings</h2>
    <div id="sightings-list">Loading...</div>
  </section>

  <!-- Load the Socket.io client library from our server -->
  <script src="/socket.io/socket.io.js"></script>

  <script>
    const socket = io();

    const form = document.querySelector("#sighting-form");
    const message = document.querySelector("#message");
    const list = document.querySelector("#sightings-list");
    const dateInput = document.querySelector("#date");
    const submitButton = document.querySelector("#submit-button");
    const connectionStatus = document.querySelector("#connection-status");

    dateInput.value = getLocalDate();

    function getLocalDate() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    // Load previously saved records from Lowdb
    async function loadSightings() {
      try {
        const response = await fetch("/data");

        if (!response.ok) {
          throw new Error("Failed to load records.");
        }

        const sightings = await response.json();
        renderSightings(sightings);
      } catch (error) {
        list.textContent = "Could not load records.";
        console.error("Error loading sightings:", error);
      }
    }

    // Display records safely on the page
    function renderSightings(sightings) {
      list.replaceChildren();

      if (!Array.isArray(sightings) || sightings.length === 0) {
        list.textContent = "No sightings yet. Add your first one!";
        return;
      }

      sightings.forEach((item) => {
        const record = document.createElement("div");
        record.className = "record";

        const title = document.createElement("h3");
        title.textContent = item.aircraft;

        const details = document.createElement("p");
        details.textContent = `${item.airport} · ${item.date}`;

        record.append(title, details);

        if (item.notes) {
          const notes = document.createElement("p");
          notes.textContent = item.notes;
          record.appendChild(notes);
        }

        list.appendChild(record);
      });
    }

    // Update the connection indicator
    socket.on("connect", () => {
      connectionStatus.textContent = "Connected — live updates are enabled.";
      loadSightings();
      console.log("Connected to Socket.io:", socket.id);
    });

    socket.on("disconnect", () => {
      connectionStatus.textContent = "Disconnected — trying to reconnect...";
    });

    // Receive a new sighting broadcast by the server
    socket.on("sighting-added", (newSighting) => {
      console.log("New sighting received:", newSighting);

      message.textContent = `New sighting shared: ${newSighting.aircraft}`;

      // Reload the saved list so every connected browser stays in sync
      loadSightings();
    });

    // Receive an error from the server
    socket.on("sighting-error", (errorData) => {
      message.textContent = errorData.message || "Could not save the sighting.";
      submitButton.disabled = false;
    });

    // Send the new sighting to the server through Socket.io
    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!socket.connected) {
        message.textContent = "Not connected to the server. Please try again.";
        return;
      }

      const data = Object.fromEntries(new FormData(form).entries());

      submitButton.disabled = true;
      message.textContent = "Saving sighting...";

      // Client-side emit: send the record to the server
      socket.emit("new-sighting", data);

      form.reset();
      dateInput.value = getLocalDate();
    });

    // Re-enable the button after the server broadcasts a saved record
    socket.on("sighting-added", () => {
      submitButton.disabled = false;
    });

    // Initial load in case the saved records already exist
    loadSightings();
  </script>
</body>
</html>
